name: Build SPOTI NOX

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: Windows (.exe)
    runs-on: windows-latest
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm test
      - run: npm run dist:win
      - uses: actions/upload-artifact@v4
        with:
          name: SPOTI-NOX-windows
          path: dist/*.exe

  android:
    name: Android (.apk)
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm install
      - run: npx cap add android
      - name: Icones SPOTI NOX
        run: |
          for d in android-icons/mipmap-*; do cp "$d"/*.png "android/app/src/main/res/$(basename $d)/"; done
          printf '<?xml version="1.0" encoding="utf-8"?>\n<resources>\n    <color name="ic_launcher_background">#1FD45F</color>\n</resources>\n' > android/app/src/main/res/values/ic_launcher_background.xml
          mkdir -p android/app/src/main/res/mipmap-anydpi-v26
          for n in ic_launcher ic_launcher_round; do
            printf '<?xml version="1.0" encoding="utf-8"?>\n<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">\n    <background android:drawable="@color/ic_launcher_background"/>\n    <foreground android:drawable="@mipmap/ic_launcher_foreground"/>\n</adaptive-icon>\n' > android/app/src/main/res/mipmap-anydpi-v26/$n.xml
          done
      - run: npx cap sync android
      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug
      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk SPOTI-NOX.apk
      - uses: actions/upload-artifact@v4
        with:
          name: SPOTI-NOX-android
          path: SPOTI-NOX.apk

  release:
    name: Publier la release
    needs: [windows, android]
    if: ${{ !cancelled() && (needs.windows.result == 'success' || needs.android.result == 'success') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Publier dans les Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="$GITHUB_REF_NAME"
          case "$GITHUB_REF" in refs/tags/*) ;; *) TAG=latest ;; esac
          ls -la out
          gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes || true
          gh release create "$TAG" out/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "SPOTI NOX ($TAG)" \
            --notes "Installateur et version portable Windows (.exe) + APK Android. Version construite automatiquement."
