<!doctype html><meta charset="utf-8"><title>engine tests</title>
<script type="module">
import { buildGraph, applyBands } from '/www/js/analyzer.js';
import * as D from '/www/js/dsp.js';
import { TruePeakLimiter } from '/www/js/limiter-core.js';

const BASE = '/www/js/';
const res = [];
const ok = (name, cond, extra = '') => res.push({ name, ok: !!cond, extra: String(extra) });
const near = (a, b, t) => Math.abs(a - b) <= t;
const db = (x) => 20 * Math.log10(x);

const sine = (f, amp, n, sr, ph = 0) => { const x = new Float32Array(n); for (let i = 0; i < n; i++) x[i] = amp * Math.sin(2 * Math.PI * f * i / sr + ph); return x; };
let seed = 11; const rnd = () => (seed = (seed * 1664525 + 1013904223) >>> 0) / 4294967296 * 2 - 1;
const noise = (n, amp) => { const x = new Float32Array(n); let y = 0; for (let i = 0; i < n; i++) { y += 0.3 * (rnd() - y); x[i] = amp * y * 3; } return x; };

// Rend le graphe sur un contexte hors-ligne. setup(g, ctx) configure ; renvoie { L, R, g }
async function render(chs, sr, setup, { seconds, mode = 'wet', graphOpts = {} } = {}) {
  const n = chs[0].length;
  const ctx = new OfflineAudioContext(2, n, sr);
  const buf = ctx.createBuffer(chs.length, n, sr);
  chs.forEach((c, i) => buf.copyToChannel(c, i));
  const src = ctx.createBufferSource(); src.buffer = buf;
  const g = await buildGraph(ctx, src, { base: BASE, ...graphOpts });
  if (setup) await setup(g, ctx);
  if (mode === 'dry') { g.wet.gain.value = 0; g.dry.gain.value = 1; }
  src.start();
  const out = await ctx.startRendering();
  return { L: out.getChannelData(0), R: out.getChannelData(1), g };
}
const rms = (x, a, b) => { let s = 0; for (let i = a; i < b; i++) s += x[i] * x[i]; return Math.sqrt(s / (b - a)); };
function refTP(x, a, b, over = 16, half = 32) {
  let pk = 0;
  for (let n = a; n < b; n++) for (let p = 0; p < over; p++) {
    const f = p / over; let v = 0;
    for (let k = -half + 1; k <= half; k++) { const d = k - f; const s = d === 0 ? 1 : Math.sin(Math.PI * d) / (Math.PI * d); v += x[n + k] * s * (0.5 + 0.5 * Math.cos(Math.PI * d / half)); }
    if (Math.abs(v) > pk) pk = Math.abs(v);
  }
  return db(pk);
}
const setBands = (bands, on = true) => (g) => applyBands(g, bands, on);

window.runAll = async () => {
  const SR = 48000, N = SR * 2;
  const music = noise(N, 0.3);
  const music2 = noise(N, 0.25);
  const hz1k = sine(1000, 0.5, N, SR);

  // 0) le graphe se construit avec les trois worklets
  {
    const { g } = await render([hz1k, hz1k], SR, null);
    ok('Graphe : worklets chargés (loudness, stéréo, limiteur) sans repli', g.degraded.length === 0 && g.limiterKind === 'worklet' && g.stereoKind === 'worklet' && !!g.mIn, g.degraded.join('|'));
    ok('Latence du limiteur annoncée = 255 éch. à 48 kHz', g.latency === 255, g.latency);
  }

  // 1) transparence : tout désactivé (EQ plat, stéréo neutre, normalisation 1, limiteur OFF) => sortie = entrée retardée
  {
    const { L, R, g } = await render([music, music2], SR, (g) => { applyBands(g, D.bandsForPreset('flat'), true); }, { graphOpts: { initial: { limiter: { enabled: false } } } });
    const d = g.latency; let e = 0, ref = 0;
    for (let i = d + 100; i < N; i++) { e = Math.max(e, Math.abs(L[i] - music[i - d]), Math.abs(R[i] - music2[i - d])); ref = Math.max(ref, Math.abs(music[i - d])); }
    ok('Transparence : EQ plat + limiteur off → erreur < -120 dB', db(e / ref + 1e-30) < -120, `${db(e / ref + 1e-30).toFixed(1)} dB`);
  }
  // 1b) limiteur ON mais signal sous le plafond : identique aussi
  {
    const { L, g } = await render([music, music2], SR, (g) => { applyBands(g, D.bandsForPreset('flat'), true); });
    const d = g.latency; let e = 0;
    for (let i = d + 100; i < N; i++) e = Math.max(e, Math.abs(L[i] - music[i - d]));
    ok('Transparence : limiteur actif mais inutile → signal inchangé', db(e + 1e-30) < -120, `${db(e + 1e-30).toFixed(1)} dB`);
  }
  // 1c) EQ désactivé avec des bandes non nulles => transparent
  {
    const { L, g } = await render([music, music2], SR, (g) => { applyBands(g, D.bandsForPreset('electronic'), false); });
    const d = g.latency; let e = 0;
    for (let i = d + 100; i < N; i++) e = Math.max(e, Math.abs(L[i] - music[i - d]));
    ok('EQ désactivé (preset Electronic en mémoire) → signal inchangé', db(e + 1e-30) < -120, `${db(e + 1e-30).toFixed(1)} dB`);
  }

  // 2) EQ : gains mesurés sur des sinus
  const gainAt = async (bands, f, extra) => {
    const x = sine(f, 0.1, SR, SR);
    const { L } = await render([x, x], SR, (g) => { applyBands(g, bands, true); if (extra) extra(g); }, { graphOpts: { initial: { limiter: { enabled: false } } } });
    return db(rms(L, 24000, 48000) / rms(x, 24000, 48000));
  };
  {
    const bb = D.bandsForPreset('bassboost');
    const g40 = await gainAt(bb, 40), g1k = await gainAt(bb, 1000), g10k = await gainAt(bb, 10000);
    ok('EQ Bass Boost (graphe réel) : ≈ +4 dB à 40 Hz, ≈ 0 dB à 1 kHz et 10 kHz', near(g40, 3.9, 0.3) && near(g1k, 0, 0.1) && near(g10k, 0, 0.1), `${g40.toFixed(2)} / ${g1k.toFixed(2)} / ${g10k.toFixed(2)}`);
    const tr = D.bandsForPreset('treblereduction');
    const a = await gainAt(tr, 15000), b = await gainAt(tr, 200);
    ok('EQ Treble Reduction : ≈ -3 dB à 15 kHz, 0 dB à 200 Hz', near(a, -3, 0.4) && near(b, 0, 0.1), `${a.toFixed(2)} / ${b.toFixed(2)}`);
    const bands = D.defaultBands(); bands[0].on = true; bands[0].f = 100; bands[0].q = 0.7071;
    const h50 = await gainAt(bands, 50), h1k = await gainAt(bands, 1000), h100 = await gainAt(bands, 100);
    ok('Passe-haut 100 Hz : -12 dB à 50 Hz, -3 dB à 100 Hz, 0 dB à 1 kHz', near(h50, -12.3, 0.8) && near(h100, -3, 0.4) && near(h1k, 0, 0.1), `${h50.toFixed(2)} / ${h100.toFixed(2)} / ${h1k.toFixed(2)}`);
    const nb = D.defaultBands(); nb[3].type = 'notch'; nb[3].f = 1000; nb[3].q = 4; nb[3].on = true;
    const n1k = await gainAt(nb, 1000), n2k = await gainAt(nb, 2000);
    ok('Notch 1 kHz : creux profond à 1 kHz, neutre à 2 kHz', n1k < -30 && near(n2k, 0, 0.5), `${n1k.toFixed(1)} / ${n2k.toFixed(2)}`);
    // la réponse calculée (graphe de l'interface) correspond à la réponse réelle
    const calc = D.eqResponseDb(bb, [40], SR)[0];
    ok('Courbe de l\'interface = réponse réelle du filtre (±0,3 dB)', near(calc, g40, 0.3), `${calc.toFixed(2)} vs ${g40.toFixed(2)}`);
  }

  // 3) limiteur dans le graphe : sinus +6 dBFS
  {
    const hot = sine(1000, 2.0, N, SR);
    const { L, R } = await render([hot, hot], SR, (g) => applyBands(g, D.bandsForPreset('flat'), true), { graphOpts: { initial: { limiter: { ceilingDb: -1, enabled: true } } } });
    const tp = refTP(L, 4000, 8000);
    ok('Limiteur (graphe réel) : +6 dBFS → ≤ -1 dBTP', tp <= -0.9, `${tp.toFixed(3)} dBTP`);
    ok('Limiteur : canaux liés (L = R)', L.every((v, i) => i < 3000 || v === R[i]));
  }
  // 3b) EQ qui ajoute du gain + limiteur : pas d'écrêtage
  {
    const loud = sine(60, 0.9, N, SR);
    const { L } = await render([loud, loud], SR, (g) => applyBands(g, D.bandsForPreset('bassboost'), true), { graphOpts: { initial: { limiter: { ceilingDb: -1, enabled: true } } } });
    let mx = 0; for (let i = 4000; i < N; i++) mx = Math.max(mx, Math.abs(L[i]));
    ok('EQ +4 dB sur un signal à -0,9 dBFS : sortie ≤ -1 dBTP (pas d\'écrêtage)', db(mx) <= -0.9, `${db(mx).toFixed(2)} dBFS`);
  }

  // 4) stéréo dans le graphe
  {
    const A = sine(300, 0.3, N, SR), B = sine(500, 0.2, N, SR, 0.7);
    const flat = (g) => applyBands(g, D.bandsForPreset('flat'), true);
    let r = await render([A, B], SR, flat, { graphOpts: { initial: { limiter: { enabled: false }, stereo: { width: 0 } } } });
    let e = 0; for (let i = 20000; i < N; i++) e = Math.max(e, Math.abs(r.L[i] - r.R[i]));
    ok('Stéréo (graphe réel) : largeur 0 → mono', e < 1e-6, e.toExponential(1));
    r = await render([A, B], SR, flat, { graphOpts: { initial: { limiter: { enabled: false }, stereo: { balance: -1 } } } });
    ok('Stéréo : balance -1 → canal droit coupé', rms(r.R, 20000, N) < 1e-6 && rms(r.L, 20000, N) > 0.05);
    r = await render([A, B], SR, flat, { graphOpts: { initial: { limiter: { enabled: false }, stereo: { mono: true } } } });
    e = 0; for (let i = 20000; i < N; i++) e = Math.max(e, Math.abs(r.L[i] - (A[i - 255] + B[i - 255]) / 2));
    ok('Stéréo : écoute mono = (L+R)/2', e < 1e-5, e.toExponential(1));
  }

  // 5) A/B et bypass
  {
    const { L, g } = await render([music, music2], SR, (g) => { applyBands(g, D.bandsForPreset('electronic'), true); g.wet.gain.value = 0; g.dry.gain.value = 1; });
    const d = g.latency; let e = 0;
    for (let i = d + 100; i < N; i++) e = Math.max(e, Math.abs(L[i] - music[i - d]));
    ok('A/B : voie « original » = entrée exacte, alignée sur la voie traitée', db(e + 1e-30) < -120, `${db(e + 1e-30).toFixed(1)} dB`);
    const proc = await render([music, music2], SR, (g) => applyBands(g, D.bandsForPreset('electronic'), true));
    let diff = 0; for (let i = d + 100; i < N; i++) diff = Math.max(diff, Math.abs(proc.L[i] - music[i - d]));
    ok('A/B : la voie traitée diffère bien de l\'originale (Electronic)', diff > 0.01, diff.toFixed(3));
  }

  // 6) normalisation : gain appliqué = gain calculé
  {
    const x = sine(1000, 0.1, N, SR);
    const { L } = await render([x, x], SR, (g) => { applyBands(g, D.bandsForPreset('flat'), true); g.norm.gain.value = D.dbToLin(5); }, { graphOpts: { initial: { limiter: { enabled: false } } } });
    ok('Normalisation : gain +5 dB appliqué', near(db(rms(L, 24000, N) / rms(x, 24000, N)), 5, 0.02), db(rms(L, 24000, N) / rms(x, 24000, N)).toFixed(3));
  }

  // 7) pas de clic quand on change un paramètre pendant la lecture
  {
    const x = sine(1000, 0.25, SR * 2, SR);
    const { L } = await render([x, x], SR, async (g, ctx) => {
      ctx.suspend(0.5).then(() => { const b = D.bandsForPreset('flat'); b[4].gain = 12; applyBands(g, b, true); ctx.resume(); });
    }, { graphOpts: { initial: { limiter: { enabled: false } } } });
    let jump = 0; for (let i = 10; i < L.length; i++) jump = Math.max(jump, Math.abs(L[i] - L[i - 1]));
    const sineStep = 1.0 * 2 * Math.PI * 1000 / SR;     // saut maximal d'un sinus d'amplitude 1 (4 x 0,25)
    ok('Changement de gain +12 dB en cours de lecture : pas de discontinuité', jump < sineStep * 1.15, `saut max ${jump.toFixed(3)} (sinus pur : ${sineStep.toFixed(3)})`);
    ok('…et le gain finit par être atteint (+12 dB)', near(db(rms(L, 80000, 96000) / rms(x, 80000, 96000)), 12, 0.3), db(rms(L, 80000, 96000) / rms(x, 80000, 96000)).toFixed(2));
  }

  // 8) fréquences d'échantillonnage et mono
  for (const sr of [44100, 96000]) {
    const n = sr, x = noise(n, 0.3);
    const { L, g } = await render([x], sr, (g) => applyBands(g, D.bandsForPreset('flat'), true));
    const d = g.latency; let e = 0; for (let i = d + 100; i < n; i++) e = Math.max(e, Math.abs(L[i] - x[i - d]));
    ok(`Source mono à ${sr} Hz : transparente et alignée`, db(e + 1e-30) < -120, `${db(e + 1e-30).toFixed(1)} dB, latence ${d} éch.`);
  }

  // 9) les mesures du graphe = mesures hors-ligne (K-weighting, True Peak)
  {
    const x = sine(997, 0.1, SR * 5, SR);
    const msgs = [];
    const ctx = new OfflineAudioContext(2, SR * 5, SR);
    const buf = ctx.createBuffer(2, SR * 5, SR); buf.copyToChannel(x, 0); buf.copyToChannel(x, 1);
    const src = ctx.createBufferSource(); src.buffer = buf;
    const g = await buildGraph(ctx, src, { base: BASE });
    g.mOut.port.onmessage = (e) => msgs.push(e.data);
    src.start(); await ctx.startRendering(); await new Promise((r) => setTimeout(r, 400));
    const { LufsMeter } = await import('/www/js/lufs.js');
    const m = new LufsMeter(); msgs.forEach((e) => m.push(e));
    const off = await D.analyzeBuffer({ sampleRate: SR, numberOfChannels: 2, getChannelData: () => x });
    ok('Loudness : worklet temps réel = analyse hors-ligne (±0,1 LU)', msgs.length > 30 && near(m.integrated, off.integrated, 0.1), `${m.integrated.toFixed(2)} vs ${off.integrated.toFixed(2)} LUFS (${msgs.length} blocs)`);
  }
  return res;
};
</script>
